name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches app version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${version}" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.5
          cache: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Export Go path for package builds
        run: echo "ZWIP_GO=$(command -v go)" >> "$GITHUB_ENV"
      - run: npm ci
      # The notices script runs `cargo metadata --offline`, so crates must be downloaded first.
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - run: npm test
      - run: npm run build
      - name: Archive app
        run: |
          cd target/release/bundle/macos
          ditto -c -k --keepParent Zwip.app "Zwip-${GITHUB_REF_NAME}-macos-arm64.zip"
          shasum -a 256 "Zwip-${GITHUB_REF_NAME}-macos-arm64.zip" > "Zwip-${GITHUB_REF_NAME}-macos-arm64.zip.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd target/release/bundle/macos
          gh release create "${GITHUB_REF_NAME}" \
            "Zwip-${GITHUB_REF_NAME}-macos-arm64.zip" \
            "Zwip-${GITHUB_REF_NAME}-macos-arm64.zip.sha256" \
            --title "Zwip ${GITHUB_REF_NAME}" \
            --generate-notes \
            --prerelease
