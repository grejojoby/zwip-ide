name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.5
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Export Go path for package builds
        run: echo "ZWIP_GO=$(command -v go)" >> "$GITHUB_ENV"
      - run: npm ci
      # Tauri's build script requires the generated notices resource, so clippy needs it too.
      - name: Generate bundled resources
        run: |
          npm run build:web
          node scripts/application-notices.mjs
      - run: npm run check
      - run: npm test
