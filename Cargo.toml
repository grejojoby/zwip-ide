[workspace]
members = ["crates/ide-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

# Rust's stripping can leave proc-macro LINKEDIT data misaligned on macOS 27.
# Keep compile-time libraries loadable without changing shipped release code.
[profile.release.build-override]
strip = "none"
